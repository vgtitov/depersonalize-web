name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Проверка, что index.html собран из исходников
        run: |
          sh build.sh
          git diff --exit-code index.html
      - name: Тесты
        run: sh run_tests.sh
